<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Monospace is a place for developers to write and read technical articles." />
    <meta name="theme-color" content="#f6f4ef" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Monospace</title>
    <script>
      // Apply the saved theme before the first paint so dark mode does not flash light.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('theme');
        } catch (error) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
